# Static sandbox policy. Per-run settings (job mount, time, memory, pids, cgroup root) are passed as flags.
name: "evalcue-runner"
mode: ONCE
hostname: "sandbox"
cwd: "/work"

# Fresh namespaces for everything, including network: sandboxed code has no network access at all.
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

# Run as nobody; root inside the container is never visible to candidate code.
uidmap { inside_id: "65534" outside_id: "65534" count: 1 }
gidmap { inside_id: "65534" outside_id: "65534" count: 1 }

keep_env: false
envar: "PATH=/usr/local/bin:/usr/bin:/bin:/opt/java/bin"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PYTHONUNBUFFERED=1"

# Node and the JVM reserve large virtual address spaces, so memory is capped by cgroup, not RLIMIT_AS.
rlimit_as_type: INF
rlimit_core: 0
rlimit_fsize: 16
rlimit_nofile: 256
rlimit_stack_type: SOFT

mount_proc: true

mount { src: "/usr" dst: "/usr" is_bind: true }
mount { src: "/opt/java" dst: "/opt/java" is_bind: true }
mount { src: "/etc/alternatives" dst: "/etc/alternatives" is_bind: true mandatory: false }
mount { src: "/etc/ld.so.cache" dst: "/etc/ld.so.cache" is_bind: true mandatory: false }
mount { src: "usr/bin" dst: "/bin" is_symlink: true }
mount { src: "usr/lib" dst: "/lib" is_symlink: true }
mount { src: "usr/lib64" dst: "/lib64" is_symlink: true }
mount { dst: "/tmp" fstype: "tmpfs" rw: true options: "size=64m" }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/zero" dst: "/dev/zero" is_bind: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true }
mount { src: "/dev/urandom" dst: "/dev/random" is_bind: true }
