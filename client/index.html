<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="EvalcueAI" />
    <meta name="theme-color" content="#ffffff" />
    <style>
      /* Prerendered SEO markup stays in the DOM for crawlers but is hidden until React replaces it.
         If the app bundle fails to load, reveal it after a delay so the page is never blank. */
      #root > [data-static-seo] {
        opacity: 0;
        animation: evalcue-static-reveal 0.2s ease-out 5s forwards;
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 16px;
        font: 16px/1.6 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c1d21;
      }
      html[data-theme="dark"] #root > [data-static-seo] { color: #e6e7ea; }
      #root > [data-static-seo] a { color: inherit; }
      @keyframes evalcue-static-reveal { to { opacity: 1; } }
    </style>
    <noscript><style>#root > [data-static-seo] { opacity: 1; animation: none; }</style></noscript>
    <script>
      (() => {
        const valid = (value) => value === "dark" || value === "light";
        let mode = "";
        try {
          const prefix = "evalcue_theme=";
          const cookie = document.cookie.split(";").map((part) => part.trim()).find((part) => part.startsWith(prefix));
          if (cookie) mode = decodeURIComponent(cookie.slice(prefix.length));
        } catch { /* Cookies may be unavailable. */ }
        if (!valid(mode)) {
          try { mode = localStorage.getItem("ia:theme") || ""; } catch { /* Storage may be unavailable. */ }
        }
        if (!valid(mode)) mode = "light";
        const root = document.documentElement;
        root.classList.toggle("dark", mode === "dark");
        root.dataset.theme = mode;
        root.style.colorScheme = mode;
        root.style.backgroundColor = mode === "dark" ? "#0e0f11" : "#fafbff";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", mode === "dark" ? "#0e0f11" : "#ffffff");
      })();
    </script>
    <meta name="description" content="EvalcueAI is AI interview practice and structured technical hiring for software engineers: coding, system design, debugging, and technical interviews with adaptive AI follow-ups." />
    <meta name="robots" content="index,follow" />
    <meta property="og:title" content="EvalcueAI | AI Coding, System Design & Debugging Interviews for Engineers" />
    <meta property="og:description" content="EvalcueAI is AI interview practice and structured technical hiring for software engineers: coding, system design, debugging, and technical interviews with adaptive AI follow-ups." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EvalcueAI" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EvalcueAI | AI Coding, System Design & Debugging Interviews for Engineers" />
    <meta name="twitter:description" content="Adaptive software engineering interview practice and structured technical hiring with coding, system design, and evidence-led review." />
    <title>EvalcueAI | AI Coding, System Design & Debugging Interviews for Engineers</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
