name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
      - run: npm run check:entry-bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report
            client/test-results
          if-no-files-found: ignore
          retention-days: 14
      # React Router's remaining advisory affects RSC action handling; this app
      # is a client-only BrowserRouter SPA. Critical findings still fail CI.
      # Registry/network failures retry, but actual audit findings fail immediately.
      - name: Client dependency audit
        run: bash ../.github/scripts/npm-audit-retry.sh --omit=dev --audit-level=critical

  server:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Server unit tests
        run: npm run test:unit
      - name: Server API journeys
        run: npm run test:e2e
      - name: Server dependency audit
        run: bash ../.github/scripts/npm-audit-retry.sh --omit=dev --audit-level=high
